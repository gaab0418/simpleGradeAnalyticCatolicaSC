<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim Católica SC</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C2B4A'/%3E%3Cpath d='M9 22V10M13 22V10M17 22V10M21 22V10M7 20l16-8' stroke='%23FFE66D' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Tema claro: caderno quadriculado, caneta azul, correção em vermelho, marca-texto */
        :root {
            --paper: #F6F8FB;
            --paper-raised: #FFFFFF;
            --grid: #E2E9F2;
            --rule: #C9D3E1;
            --ink: #1C2B4A;
            --pencil: #6E7891;
            --red-pen: #C8102E;
            --hl-ok: #BDF0A8;
            --hl-calm: #BFE6FF;
            --hl-warn: #FFE66D;
            --hl-tight: #FFC48C;
            --hl-crit: #FFA3B8;
            --hl-none: #E3E7EE;
            --tick-empty: #D3DCE8;
            --focus: #2F6FED;

            --font-ui: "Schibsted Grotesk", system-ui, sans-serif;
            --font-hand: "Kalam", "Segoe Print", cursive;
            color-scheme: light;
        }

        /* Tema escuro: lousa, giz e giz colorido */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --paper: #1D2824;
                --paper-raised: #23302B;
                --grid: rgba(255, 255, 255, 0.035);
                --rule: rgba(233, 238, 232, 0.14);
                --ink: #E9EEE8;
                --pencil: #95A59E;
                --red-pen: #FF8F8F;
                --hl-ok: rgba(140, 225, 120, 0.30);
                --hl-calm: rgba(130, 200, 255, 0.26);
                --hl-warn: rgba(255, 225, 90, 0.30);
                --hl-tight: rgba(255, 170, 100, 0.32);
                --hl-crit: rgba(255, 120, 150, 0.34);
                --hl-none: rgba(233, 238, 232, 0.10);
                --tick-empty: rgba(233, 238, 232, 0.13);
                --focus: #8FB8FF;
                color-scheme: dark;
            }
        }
        :root[data-theme="dark"] {
            --paper: #1D2824;
            --paper-raised: #23302B;
            --grid: rgba(255, 255, 255, 0.035);
            --rule: rgba(233, 238, 232, 0.14);
            --ink: #E9EEE8;
            --pencil: #95A59E;
            --red-pen: #FF8F8F;
            --hl-ok: rgba(140, 225, 120, 0.30);
            --hl-calm: rgba(130, 200, 255, 0.26);
            --hl-warn: rgba(255, 225, 90, 0.30);
            --hl-tight: rgba(255, 170, 100, 0.32);
            --hl-crit: rgba(255, 120, 150, 0.34);
            --hl-none: rgba(233, 238, 232, 0.10);
            --tick-empty: rgba(233, 238, 232, 0.13);
            --focus: #8FB8FF;
            color-scheme: dark;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: var(--font-ui);
            font-size: 1rem;
            line-height: 1.5;
            color: var(--ink);
            background-color: var(--paper);
            background-image:
                linear-gradient(var(--grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 24px 24px;
            -webkit-font-smoothing: antialiased;
        }

        button { font: inherit; color: inherit; }
        :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

        .wrap { width: 100%; max-width: 1080px; margin: 0 auto; padding: 0 24px; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        /* ---------- Topo ---------- */
        .top {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 16px 24px;
            padding-top: 28px;
            padding-bottom: 20px;
        }
        .who-name { margin: 0; font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.01em; }
        .who-meta { margin: 0; font-size: 0.875rem; color: var(--pencil); }

        .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

        .periods {
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid var(--rule);
            border-radius: 10px;
            background: var(--paper-raised);
        }
        .period {
            border: 0;
            background: transparent;
            padding: 6px 12px;
            border-radius: 7px;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--pencil);
            cursor: pointer;
        }
        .period:hover { color: var(--ink); }
        .period[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 38px;
            padding: 0 12px;
            border: 1px solid var(--rule);
            border-radius: 10px;
            background: var(--paper-raised);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }
        .icon-btn:hover { border-color: var(--pencil); }
        .icon-btn svg { width: 16px; height: 16px; }
        .icon-btn[data-busy="true"] svg { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---------- Resumo (hero) ---------- */
        .summary { padding-top: 28px; padding-bottom: 36px; border-top: 1px solid var(--rule); }
        .headline {
            margin: 0;
            max-width: 26ch;
            font-size: clamp(1.75rem, 1.2rem + 2.4vw, 2.75rem);
            line-height: 1.12;
            font-weight: 700;
            letter-spacing: -0.025em;
            text-wrap: balance;
        }
        .note {
            margin: 14px 0 0;
            max-width: 52ch;
            font-family: var(--font-hand);
            font-size: 1.375rem;
            line-height: 1.35;
            color: var(--red-pen);
            transform: rotate(-0.6deg);
            transform-origin: left;
        }
        .note:empty { display: none; }
        .facts {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 28px;
            margin: 24px 0 0;
            padding: 0;
            list-style: none;
            font-size: 0.875rem;
            color: var(--pencil);
        }
        .facts strong { color: var(--ink); font-weight: 600; }

        /* ---------- Boletim ---------- */
        .sheet {
            background: var(--paper-raised);
            border: 1px solid var(--rule);
            border-radius: 14px;
            overflow: hidden;
        }
        .sheet[aria-busy="true"] { opacity: 0.55; transition: opacity 0.2s; }

        .cols {
            display: grid;
            grid-template-columns: minmax(0, 1fr) repeat(3, 4rem) 4.5rem 8.25rem 9.5rem 1.25rem;
            column-gap: 12px;
            align-items: center;
        }
        .sheet-head {
            padding: 12px 20px;
            border-bottom: 1px solid var(--rule);
            font-size: 0.8125rem;
            color: var(--pencil);
        }
        .num { text-align: center; }

        .subject + .subject { border-top: 1px solid var(--rule); }
        .row-head {
            width: 100%;
            padding: 16px 20px;
            border: 0;
            background: transparent;
            text-align: left;
            cursor: pointer;
        }
        .row-head:hover { background: color-mix(in srgb, var(--grid) 55%, transparent); }
        .row-head:focus-visible { outline-offset: -3px; }

        .s-name { min-width: 0; }
        .s-title { display: block; font-weight: 600; line-height: 1.3; }
        .s-code { display: block; font-size: 0.8125rem; color: var(--pencil); }

        .grade { font-size: 1.0625rem; font-weight: 500; text-align: center; }
        .grade.low { color: var(--red-pen); }
        .grade.empty { color: var(--pencil); }
        .grade.need {
            font-family: var(--font-hand);
            font-weight: 400;
            font-size: 1.1875rem;
            color: var(--pencil);
        }
        .grade.need::before { content: "≥"; font-size: 0.8em; margin-right: 1px; opacity: 0.8; }
        .grade.need.over { color: var(--red-pen); }
        .sum { font-weight: 700; }
        .sum small { display: block; font-size: 0.6875rem; font-weight: 400; color: var(--pencil); line-height: 1; margin-top: 2px; }

        /* Faltas: 5 dias, 4 aulas por dia */
        .tally { display: flex; gap: 6px; justify-content: center; }
        .day { position: relative; display: flex; gap: 2px; padding: 0 1px; }
        .tick { width: 2.5px; height: 16px; border-radius: 2px; background: var(--tick-empty); }
        .tick.on { background: var(--ink); }
        .tally.warn .tick.on { background: var(--red-pen); }
        .day.full::after {
            content: "";
            position: absolute;
            left: -2px; right: -2px; top: 7px;
            height: 2px;
            border-radius: 2px;
            background: var(--red-pen);
            transform: rotate(-28deg);
        }

        .status-cell { text-align: left; }
        .hl {
            display: inline-block;
            padding: 1px 8px;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.5;
            border-radius: 3px 8px 4px 9px;
            background: linear-gradient(100deg, transparent 2px, var(--hl) 4px, var(--hl) calc(100% - 4px), transparent calc(100% - 2px));
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }
        .hl[data-tone="ok"] { --hl: var(--hl-ok); }
        .hl[data-tone="calm"] { --hl: var(--hl-calm); }
        .hl[data-tone="warn"] { --hl: var(--hl-warn); }
        .hl[data-tone="tight"] { --hl: var(--hl-tight); }
        .hl[data-tone="crit"] { --hl: var(--hl-crit); }
        .hl[data-tone="none"] { --hl: var(--hl-none); font-weight: 500; }

        .chev { width: 16px; height: 16px; color: var(--pencil); transition: transform 0.2s; }
        .row-head[aria-expanded="true"] .chev { transform: rotate(180deg); }

        /* ---------- Simulador ---------- */
        .sim {
            display: grid;
            grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
            gap: 24px 40px;
            padding: 4px 20px 24px;
        }
        .sim[hidden] { display: none; }
        .sim h3 { margin: 0 0 10px; font-size: 0.9375rem; font-weight: 600; }
        .sim p { margin: 0; font-size: 0.9375rem; }
        .sim .muted { color: var(--pencil); font-size: 0.875rem; }

        .slider { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) 2.75rem; align-items: center; gap: 12px; margin-bottom: 8px; }
        .slider label { font-size: 0.875rem; color: var(--pencil); }
        .slider output { font-family: var(--font-hand); font-size: 1.25rem; text-align: right; }
        input[type="range"] { width: 100%; accent-color: var(--ink); cursor: pointer; }

        .verdict { margin-top: 14px !important; padding-top: 12px; border-top: 1px dashed var(--rule); }

        /* ---------- Estados ---------- */
        .banner {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 14px 18px;
            border: 1px solid var(--red-pen);
            border-radius: 12px;
            background: var(--paper-raised);
        }
        .banner[hidden] { display: none; }
        .banner p { margin: 0; font-size: 0.9375rem; }
        .banner strong { color: var(--red-pen); }

        .skeleton-row { height: 66px; border-top: 1px solid var(--rule); position: relative; overflow: hidden; }
        .skeleton-row:first-child { border-top: 0; }
        .skeleton-row::before {
            content: "";
            position: absolute;
            left: 20px; top: 24px;
            height: 14px;
            width: var(--w, 40%);
            border-radius: 7px;
            background: var(--tick-empty);
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse { 50% { opacity: 0.45; } }

        .empty { padding: 40px 20px; text-align: center; color: var(--pencil); }

        footer {
            margin-top: auto;
            padding: 40px 0 28px;
            font-size: 0.8125rem;
            color: var(--pencil);
        }
        footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
        footer a { color: var(--ink); }

        /* Momento de entrada: as notas a lápis "são escritas" no boletim */
        .write-in .grade.need {
            animation: write 0.7s cubic-bezier(.5, 0, .2, 1) both;
            animation-delay: calc(var(--i, 0) * 70ms + 250ms);
        }
        @keyframes write {
            from { clip-path: inset(0 100% 0 0); }
            to { clip-path: inset(0 0 0 0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* ---------- Celular ---------- */
        @media (max-width: 760px) {
            .wrap { padding: 0 16px; }
            .sheet-head { display: none; }
            .cols {
                grid-template-columns: repeat(4, minmax(0, 1fr)) 1.25rem;
                row-gap: 12px;
            }
            .s-name { grid-column: 1 / 5; }
            .chev { grid-column: 5; grid-row: 1; }
            .grade, .sum { grid-row: 2; }
            .grade[data-label]::after, .sum[data-label]::after {
                content: attr(data-label);
                display: block;
                font-family: var(--font-ui);
                font-size: 0.6875rem;
                font-weight: 400;
                color: var(--pencil);
            }
            .sum small { display: none; }
            .tally { grid-column: 1 / 3; grid-row: 3; justify-content: flex-start; }
            .status-cell { grid-column: 3 / 6; grid-row: 3; text-align: right; }
            .sim { grid-template-columns: 1fr; }
            .periods { overflow-x: auto; max-width: 100%; }
        }
    </style>
</head>
<body>
    <header class="wrap top">
        <div>
            <p class="who-name" id="who-name">Carregando…</p>
            <p class="who-meta" id="who-meta">&nbsp;</p>
        </div>
        <div class="controls">
            <div class="periods" id="periods" role="group" aria-label="Semestre"></div>
            <button class="icon-btn" id="refresh" type="button" title="Busca as notas de novo no portal, ignorando o cache">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
                Atualizar
            </button>
            <button class="icon-btn" id="theme" type="button" aria-label="Alternar tema claro e escuro">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
            </button>
        </div>
    </header>

    <main class="wrap">
        <section class="summary" aria-live="polite">
            <h1 class="headline" id="headline">Entrando no portal da Católica…</h1>
            <p class="note" id="note"></p>
            <ul class="facts" id="facts"></ul>
        </section>

        <div class="banner" id="banner" role="alert" hidden>
            <p><strong>Não deu para buscar as notas.</strong> <span id="banner-msg"></span></p>
            <button class="icon-btn" type="button" id="retry">Tentar de novo</button>
        </div>

        <section class="sheet" id="sheet" aria-label="Boletim do semestre">
            <div class="cols sheet-head" aria-hidden="true">
                <span>Matéria</span>
                <span class="num">N1</span>
                <span class="num">N2</span>
                <span class="num">N3</span>
                <span class="num">Soma</span>
                <span class="num">Faltas</span>
                <span>Situação</span>
                <span></span>
            </div>
            <div id="rows">
                <div class="skeleton-row" style="--w:46%"></div>
                <div class="skeleton-row" style="--w:32%"></div>
                <div class="skeleton-row" style="--w:54%"></div>
                <div class="skeleton-row" style="--w:38%"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap">
            <span>Faltou uma nota? Ela aparece a lápis com o mínimo que você precisa tirar.</span>
            <span>Feito por <a href="https://github.com/gaab0418" target="_blank" rel="noopener">gaab0418</a></span>
        </div>
    </footer>

    <script>
        // ---------- Regras acadêmicas ----------
        const SOMA_APROVACAO = 18;      // média 6 em 3 notas
        const NOTA_MAX = 10;
        const LIMITE_FALTAS = 20;       // acima disso reprova (5 dias de 4 aulas)
        const AULAS_POR_DIA = 4;
        const ALERTA_FALTAS = 16;       // falta 1 dia para o limite

        // rank maior = mais urgente; tone = cor do marca-texto
        const STATUS = {
            rf:        { rank: 9, tone: "crit",  label: "Reprovada por falta" },
            reprovada: { rank: 8, tone: "crit",  label: "Reprovada" },
            fora:      { rank: 7, tone: "crit",  label: "Fora de alcance" },
            critica:   { rank: 6, tone: "crit",  label: "Crítica" },
            faltas:    { rank: 5, tone: "tight", label: "Limite de faltas" },
            apertada:  { rank: 4, tone: "tight", label: "Apertada" },
            atencao:   { rank: 3, tone: "warn",  label: "Atenção" },
            tranquila: { rank: 2, tone: "calm",  label: "Tranquila" },
            semNotas:  { rank: 1, tone: "none",  label: "Sem notas ainda" },
            garantida: { rank: 0, tone: "ok",    label: "Garantida" },
            aprovada:  { rank: 0, tone: "ok",    label: "Aprovada" },
        };

        // Classifica pela média que ainda precisa nas provas que faltam
        function statusPorNecessidade(media) {
            if (media > NOTA_MAX) return "fora";
            if (media > 8.5) return "critica";
            if (media > 7) return "apertada";
            if (media > 5) return "atencao";
            return "tranquila";
        }

        function analisar(g) {
            const notas = [g.nota1, g.nota2, g.nota3];
            const lancadas = notas.filter(n => n !== null);
            const soma = lancadas.reduce((a, b) => a + b, 0);
            const restantes = notas.length - lancadas.length;
            const faltam = Math.max(0, SOMA_APROVACAO - soma);
            const precisa = restantes > 0 ? Math.ceil((faltam / restantes) * 10) / 10 : null;
            const faltas = g.faltas || 0;
            const oficial = (g.SITUACAO || "").toLowerCase();

            let status;
            if (faltas > LIMITE_FALTAS) status = "rf";
            else if (oficial.startsWith("aprov")) status = "aprovada";
            else if (oficial.startsWith("reprov")) status = "reprovada";
            else if (lancadas.length === 0) status = "semNotas";
            else if (soma >= SOMA_APROVACAO) status = "garantida";
            else if (restantes === 0) status = "reprovada";
            else status = statusPorNecessidade(precisa);

            // Faltas perto do limite pesam mais que nota tranquila
            if (faltas >= ALERTA_FALTAS && STATUS[status].rank < STATUS.faltas.rank) status = "faltas";

            return { ...g, notas, soma, lancadas: lancadas.length, restantes, faltam, precisa, faltas, status };
        }

        // ---------- Formatação ----------
        const fmt = n => n.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        const PEQUENAS = new Set(["de", "da", "do", "das", "dos", "e", "em", "para", "a", "o"]);

        function titulo(texto) {
            if (!texto) return "";
            return texto.toLowerCase().split(/(\s+|-)/).map((p, i) => {
                const up = p.toUpperCase();
                if (/^[IVX]+$/.test(up)) return up;
                if (i > 0 && PEQUENAS.has(p)) return p;
                return p.charAt(0).toUpperCase() + p.slice(1);
            }).join("");
        }

        // "MATÉRIA - SIGLA" vira título legível + sigla original
        function nomeMateria(bruto) {
            const [nome, ...resto] = (bruto || "").split(" - ");
            return { nome: titulo(nome), sufixo: resto.join(" - ") };
        }

        // 202623 -> 2026/2
        const rotuloPeriodo = cod => `${cod.slice(0, 4)}/${cod.charAt(4)}`;

        const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

        const dias = aulas => {
            const d = aulas / AULAS_POR_DIA;
            const txt = Number.isInteger(d) ? String(d) : fmt(d);
            return `${txt} ${d === 1 ? "dia" : "dias"}`;
        };

        // ---------- Estado ----------
        const state = { periodo: null, contextos: [], carregando: false, abertas: new Set() };
        const $ = id => document.getElementById(id);

        async function carregar(periodo, fresh = false) {
            state.carregando = true;
            $("refresh").dataset.busy = "true";
            $("sheet").setAttribute("aria-busy", "true");
            $("banner").hidden = true;

            const params = new URLSearchParams();
            if (periodo) params.set("periodo", periodo);
            if (fresh) params.set("fresh", "1");

            try {
                const resp = await fetch(`/api/grades?${params}`);
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(data.error || `O servidor respondeu ${resp.status}.`);

                state.periodo = data.periodo_atual;
                state.contextos = data.contextos || [];
                renderAluno(data.aluno);
                renderPeriodos();
                renderBoletim(data.grades || [], data.atualizado_em);
            } catch (err) {
                console.error(err);
                const msg = err instanceof TypeError
                    ? "O servidor local não respondeu. Confira se o run.bat está aberto."
                    : err.message;
                $("banner-msg").textContent = msg;
                $("banner").hidden = false;
                if (!state.periodo) {
                    $("headline").textContent = "Sem conexão com o portal.";
                    $("rows").innerHTML = "";
                }
            } finally {
                state.carregando = false;
                $("refresh").dataset.busy = "false";
                $("sheet").removeAttribute("aria-busy");
            }
        }

        // ---------- Render ----------
        function renderAluno(aluno = {}) {
            $("who-name").textContent = titulo(aluno.NOMEALUNO) || "Aluno";
            $("who-meta").textContent = [titulo(aluno.NOMECURSO), aluno.RA && `RA ${aluno.RA}`].filter(Boolean).join(", ");
        }

        function renderPeriodos() {
            const box = $("periods");
            const ordenados = [...state.contextos].sort((a, b) => b.CODPERLET.localeCompare(a.CODPERLET));
            box.innerHTML = ordenados.map(c => `
                <button type="button" class="period" data-p="${esc(c.CODPERLET)}"
                    aria-pressed="${c.CODPERLET === state.periodo}"
                    title="Período ${esc(c.CODPERLET)}, ${esc(c.SITMATPERLET)}">${esc(rotuloPeriodo(c.CODPERLET))}</button>
            `).join("");
        }

        function renderTally(faltas) {
            let html = "";
            for (let d = 0; d < LIMITE_FALTAS / AULAS_POR_DIA; d++) {
                const usadas = Math.min(AULAS_POR_DIA, Math.max(0, faltas - d * AULAS_POR_DIA));
                html += `<span class="day${usadas === AULAS_POR_DIA ? " full" : ""}">`;
                for (let t = 0; t < AULAS_POR_DIA; t++) html += `<span class="tick${t < usadas ? " on" : ""}"></span>`;
                html += `</span>`;
            }
            const sobra = Math.max(0, LIMITE_FALTAS - faltas);
            const desc = `${faltas} de ${LIMITE_FALTAS} faltas. Pode faltar mais ${dias(sobra)}.`;
            return `<span class="tally${faltas >= ALERTA_FALTAS ? " warn" : ""}" role="img" aria-label="${desc}" title="${desc}">${html}</span>`;
        }

        let ordemNeed = 0;
        function renderNota(nota, idx, m) {
            const label = `N${idx + 1}`;
            if (nota !== null) {
                return `<span class="grade${nota < 6 ? " low" : ""}" data-label="${label}">${fmt(nota)}</span>`;
            }
            const final = ["aprovada", "reprovada", "rf", "garantida"].includes(m.status);
            if (final || m.precisa === null) {
                return `<span class="grade empty" data-label="${label}" aria-label="${label} sem nota">–</span>`;
            }
            const over = m.precisa > NOTA_MAX;
            return `<span class="grade need${over ? " over" : ""}" style="--i:${ordemNeed++}" data-label="${label}"
                title="Mínimo para fechar média 6" aria-label="${label} ainda sem nota; precisa de pelo menos ${fmt(m.precisa)}">${fmt(m.precisa)}</span>`;
        }

        function renderBoletim(grades, atualizadoEm) {
            const materias = grades.map(analisar).sort((a, b) =>
                STATUS[b.status].rank - STATUS[a.status].rank || (b.precisa ?? 0) - (a.precisa ?? 0));

            renderResumo(materias, atualizadoEm);

            const rows = $("rows");
            if (materias.length === 0) {
                rows.innerHTML = `<p class="empty">Nenhuma matéria neste semestre. Escolha outro semestre lá em cima.</p>`;
                return;
            }

            ordemNeed = 0;
            rows.innerHTML = materias.map((m, i) => {
                const { nome, sufixo } = nomeMateria(m.DISCIPLINA);
                const st = STATUS[m.status];
                const id = `sim-${i}`;
                const chave = m.IDTURMADISC || m.CODDISC;
                const aberta = state.abertas.has(chave);
                const extraStatus = m.media_final !== null && ["aprovada", "reprovada"].includes(m.status)
                    ? `<span class="s-code">média ${fmt(m.media_final)}</span>` : "";
                return `
                <article class="subject" data-key="${esc(chave)}">
                    <button type="button" class="row-head cols" aria-expanded="${aberta}" aria-controls="${id}">
                        <span class="s-name">
                            <span class="s-title">${esc(nome)}</span>
                            <span class="s-code">${esc(sufixo || m.CODDISC)}</span>
                        </span>
                        ${m.notas.map((n, k) => renderNota(n, k, m)).join("")}
                        <span class="grade sum" data-label="Soma">${m.lancadas ? fmt(m.soma) : "–"}<small>de ${SOMA_APROVACAO}</small></span>
                        ${renderTally(m.faltas)}
                        <span class="status-cell"><span class="hl" data-tone="${st.tone}">${st.label}</span>${extraStatus}</span>
                        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div class="sim" id="${id}" ${aberta ? "" : "hidden"}>${renderSimulador(m, i)}</div>
                </article>`;
            }).join("");

            // A animação de "escrever a lápis" só roda uma vez por carga
            const sheet = $("sheet");
            sheet.classList.remove("write-in");
            void sheet.offsetWidth;
            sheet.classList.add("write-in");

            materias.forEach((m, i) => ligarSimulador(m, i));
        }

        function renderResumo(materias, atualizadoEm) {
            const n = materias.length;
            const ok = materias.filter(m => ["garantida", "aprovada"].includes(m.status));
            const encerrado = n > 0 && materias.every(m => ["aprovada", "reprovada", "rf"].includes(m.status));
            const rf = materias.filter(m => m.status === "rf");
            const semNotas = materias.filter(m => m.status === "semNotas").length;
            const abertas = materias.filter(m => m.restantes > 0 && m.precisa > 0 && STATUS[m.status].rank >= STATUS.atencao.rank);
            const foco = abertas[0];

            let headline, note = "";
            if (n === 0) {
                headline = "Nada lançado neste semestre.";
            } else if (encerrado) {
                const medias = materias.map(m => m.media_final).filter(v => v !== null);
                headline = `Semestre encerrado: ${ok.length} de ${n} aprovadas.`;
                if (medias.length) note = `média geral ${fmt(medias.reduce((a, b) => a + b, 0) / medias.length)}`;
            } else {
                headline = ok.length === 0
                    ? `Nenhuma das ${n} matérias está garantida ainda.`
                    : ok.length === n ? `Todas as ${n} matérias garantidas.` : `${ok.length} de ${n} matérias já garantidas.`;

                if (rf.length) {
                    note = `${nomeMateria(rf[0].DISCIPLINA).nome} passou do limite de faltas.`;
                } else if (foco) {
                    const nome = nomeMateria(foco.DISCIPLINA).nome;
                    note = foco.precisa > NOTA_MAX
                        ? `${nome}: nem com 10 fecha média 6. Vale conversar com o professor.`
                        : foco.restantes === 1
                            ? `Foco em ${nome}: precisa de ${fmt(foco.precisa)} na última prova.`
                            : `Foco em ${nome}: precisa de média ${fmt(foco.precisa)} nas ${foco.restantes} provas que faltam.`;
                } else if (ok.length < n) {
                    note = "Tudo no ritmo: nenhuma matéria pede mais que média 5 no que falta.";
                }
            }

            $("headline").textContent = headline;
            $("note").textContent = note;

            const totalFaltas = materias.reduce((a, m) => a + m.faltas, 0);
            const hora = atualizadoEm ? new Date(atualizadoEm).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : null;
            const facts = [
                `<strong>${n}</strong> matérias`,
                semNotas ? `<strong>${semNotas}</strong> sem nota ainda` : null,
                `<strong>${totalFaltas}</strong> ${totalFaltas === 1 ? "falta" : "faltas"} no semestre`,
                hora ? `Atualizado às ${hora}` : null,
            ].filter(Boolean);
            $("facts").innerHTML = facts.map(f => `<li>${f}</li>`).join("");
        }

        function renderSimulador(m, i) {
            const sobra = Math.max(0, LIMITE_FALTAS - m.faltas);
            const faltasTxt = m.faltas > LIMITE_FALTAS
                ? `Você passou do limite: ${m.faltas} faltas de ${LIMITE_FALTAS} permitidas.`
                : m.faltas === 0
                ? `Nenhuma falta até agora. Dá para faltar até ${dias(sobra)} antes de reprovar.`
                : `Você faltou ${dias(m.faltas)} (${m.faltas} aulas). Ainda pode faltar ${dias(sobra)} antes de reprovar.`;
            const info = `<div>
                <h3>Faltas</h3>
                <p>${faltasTxt}</p>
                <p class="muted" style="margin-top:12px">Disciplina ${esc(m.CODDISC)}, turma ${esc(m.CODTURMA)}</p>
            </div>`;

            if (m.restantes === 0 || ["aprovada", "reprovada", "rf"].includes(m.status)) {
                const msg = m.media_final !== null
                    ? `Média final ${fmt(m.media_final)}, situação no portal: ${esc(m.SITUACAO)}.`
                    : `Todas as notas lançadas. Soma ${fmt(m.soma)} de ${SOMA_APROVACAO}.`;
                return `<div><h3>Notas</h3><p>${msg}</p></div>${info}`;
            }

            const sliders = m.notas.map((n, k) => {
                if (n !== null) return "";
                const inicial = Math.min(NOTA_MAX, m.precisa ?? 6);
                return `<div class="slider">
                    <label for="r-${i}-${k}">N${k + 1}</label>
                    <input type="range" id="r-${i}-${k}" min="0" max="10" step="0.5" value="${Math.ceil(inicial * 2) / 2}" data-k="${k}">
                    <output for="r-${i}-${k}" id="o-${i}-${k}"></output>
                </div>`;
            }).join("");

            return `<div>
                <h3>E se eu tirar…</h3>
                ${sliders}
                <p class="verdict" id="v-${i}" aria-live="polite"></p>
            </div>${info}`;
        }

        function ligarSimulador(m, i) {
            const inputs = [...document.querySelectorAll(`#sim-${i} input[type=range]`)];
            if (!inputs.length) return;
            const atualizar = () => {
                let soma = m.soma;
                inputs.forEach(inp => {
                    const v = parseFloat(inp.value);
                    soma += v;
                    $(`o-${i}-${inp.dataset.k}`).textContent = fmt(v);
                });
                const v = $(`v-${i}`);
                v.innerHTML = soma >= SOMA_APROVACAO
                    ? `Soma ${fmt(soma)}: <span class="hl" data-tone="ok">passa com média ${fmt(soma / 3)}</span>`
                    : `Soma ${fmt(soma)}: <span class="hl" data-tone="crit">faltariam ${fmt(SOMA_APROVACAO - soma)} pontos</span>`;
            };
            inputs.forEach(inp => inp.addEventListener("input", atualizar));
            atualizar();
        }

        // ---------- Eventos ----------
        $("rows").addEventListener("click", e => {
            const btn = e.target.closest(".row-head");
            if (!btn) return;
            const aberto = btn.getAttribute("aria-expanded") === "true";
            btn.setAttribute("aria-expanded", String(!aberto));
            $(btn.getAttribute("aria-controls")).hidden = aberto;
            const chave = btn.closest(".subject").dataset.key;
            aberto ? state.abertas.delete(chave) : state.abertas.add(chave);
        });

        $("periods").addEventListener("click", e => {
            const btn = e.target.closest(".period");
            if (!btn || state.carregando || btn.dataset.p === state.periodo) return;
            state.abertas.clear();
            carregar(btn.dataset.p);
        });

        $("refresh").addEventListener("click", () => !state.carregando && carregar(state.periodo, true));
        $("retry").addEventListener("click", () => carregar(state.periodo, true));

        // Tema: segue o sistema até a pessoa escolher
        function aplicarTema(t) {
            if (t) document.documentElement.dataset.theme = t;
        }
        try { aplicarTema(localStorage.getItem("tema")); } catch (_) {}
        $("theme").addEventListener("click", () => {
            const atual = document.documentElement.dataset.theme
                || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            const novo = atual === "dark" ? "light" : "dark";
            aplicarTema(novo);
            try { localStorage.setItem("tema", novo); } catch (_) {}
        });

        carregar(null);
    </script>
</body>
</html>
