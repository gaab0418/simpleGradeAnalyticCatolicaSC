name: App mobile

on:
  push:
    branches: ["**"]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
    tags: ["v*", "mobile-v*"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (opcional, ex: mobile-v1.0.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    outputs:
      versao_raw: ${{ steps.versao.outputs.raw }}
      versao_semver: ${{ steps.versao.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - name: Extrair versão do pubspec
        id: versao
        shell: bash
        run: |
          raw=$(grep -E '^version:' pubspec.yaml | head -n1 | awk '{print $2}' | tr -d '\r')
          echo "raw=$raw" >> "$GITHUB_OUTPUT"
          echo "semver=${raw%%+*}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: grade-analytic-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    needs: build
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v') ||
        startsWith(github.ref, 'refs/tags/mobile-v')
      ))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    environment:
      name: Production
      url: ${{ steps.publicar.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grade-analytic-apk
          path: artifacts
      - name: Publicar release Mobile e registrar deployment
        id: publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
          VERSAO_SEMVER: ${{ needs.build.outputs.versao_semver }}
          VERSAO_RAW: ${{ needs.build.outputs.versao_raw }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$TAG_INPUT" ]; then
            TAG="$TAG_INPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="mobile-v${VERSAO_SEMVER}"
          fi

          APK_ORIGEM=$(find artifacts -name '*.apk' -type f | head -n1)
          if [ -z "$APK_ORIGEM" ]; then
            echo "APK não encontrado no artefato." >&2
            exit 1
          fi

          APK_VERSIONADO="artifacts/grade-analytic-${TAG}.apk"
          SHA_FILE="${APK_VERSIONADO}.sha256"
          cp "$APK_ORIGEM" "$APK_VERSIONADO"
          (cd artifacts && sha256sum "$(basename "$APK_VERSIONADO")" > "$(basename "$SHA_FILE")")

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$APK_ORIGEM" \
              "$APK_VERSIONADO" \
              "$SHA_FILE" \
              -R "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              "$APK_ORIGEM" \
              "$APK_VERSIONADO" \
              "$SHA_FILE" \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Grade Analytic Mobile ${TAG} (${VERSAO_RAW})" \
              --notes "Build de produção do aplicativo Android (${VERSAO_RAW}). Inclui APK e checksum SHA-256." \
              --generate-notes
          fi

          URL=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url -q .url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

  staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    environment:
      name: Staging
      url: ${{ steps.publicar.outputs.url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grade-analytic-apk
          path: artifacts
      - name: Publicar pre-release Mobile e registrar deployment de Staging
        id: publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSAO_SEMVER: ${{ needs.build.outputs.versao_semver }}
          VERSAO_RAW: ${{ needs.build.outputs.versao_raw }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="mobile-v${VERSAO_SEMVER}-rc.${GITHUB_RUN_NUMBER}"

          APK_ORIGEM=$(find artifacts -name '*.apk' -type f | head -n1)
          if [ -z "$APK_ORIGEM" ]; then
            echo "APK não encontrado no artefato." >&2
            exit 1
          fi

          APK_VERSIONADO="artifacts/grade-analytic-${TAG}.apk"
          SHA_FILE="${APK_VERSIONADO}.sha256"
          cp "$APK_ORIGEM" "$APK_VERSIONADO"
          (cd artifacts && sha256sum "$(basename "$APK_VERSIONADO")" > "$(basename "$SHA_FILE")")

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$APK_ORIGEM" \
              "$APK_VERSIONADO" \
              "$SHA_FILE" \
              -R "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              "$APK_ORIGEM" \
              "$APK_VERSIONADO" \
              "$SHA_FILE" \
              -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Grade Analytic Mobile ${TAG} (${VERSAO_RAW} - Staging)" \
              --notes "Build de staging do aplicativo Android (${VERSAO_RAW}). Inclui APK e checksum SHA-256." \
              --generate-notes
          fi

          URL=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url -q .url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
